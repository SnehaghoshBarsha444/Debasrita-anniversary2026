<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>I knew it! ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="result-body">

<main class="result-page">
  <section class="result-container">
    <video
      class="gif-result"
      src="Love me.mp4"
      autoplay
      loop
      muted
      playsinline
      preload="auto">
    </video>

    <h1>I knew it😍!</h1>

    <button id="surpriseBtn" class="surprise-btn" type="button">
      Surprise
    </button>
  </section>
</main>

<audio
  id="resultSong"
  src="Ishq Bulaava Hasee Toh Phasee 128 Kbps.mp3"
  preload="auto">
</audio>

<script>
const resultSong = document.getElementById("resultSong");
const surpriseBtn = document.getElementById("surpriseBtn");

const START = 43;
const KEY = "debasrita-song-position";

async function playResultSong() {
  try {
    const saved = Number(localStorage.getItem(KEY));

    resultSong.currentTime =
      Number.isFinite(saved) && saved >= START
        ? saved
        : START;

    await new Promise(resolve => {
      const done = () => {
        resultSong.removeEventListener("seeked", done);
        resolve();
      };

      resultSong.addEventListener("seeked", done, { once: true });
      setTimeout(done, 1000);
    });

    await resultSong.play();
  } catch (e) {
    console.warn("Result music could not autoplay:", e);
  }
}

setInterval(() => {
  if (!resultSong.paused && Number.isFinite(resultSong.currentTime)) {
    localStorage.setItem(KEY, String(resultSong.currentTime));
  }
}, 200);

resultSong.addEventListener("ended", async () => {
  resultSong.currentTime = START;
  await playResultSong();
});

surpriseBtn.addEventListener("click", () => {
  resultSong.pause();
  resultSong.currentTime = 0;
  localStorage.removeItem(KEY);

  window.location.href = "./surprise.html";
});

playResultSong();

document.querySelector(".gif-result").play().catch(() => {});
</script>

</body>
</html>
