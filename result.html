<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <title>I Knew It! ❤️</title>
</head>

<body class="result-body">

  <main class="result-page">
    <section class="result-container" aria-label="Love result">

      <video
        class="gif-result"
        src="Love me.mp4"
        autoplay
        loop
        muted
        playsinline
        preload="auto"
        aria-hidden="true">
      </video>

      <h1>I knew it😍!</h1>

      <button
        type="button"
        class="surprise-btn"
        id="surpriseBtn">
        Surprise
      </button>

    </section>
  </main>

  <audio
    id="resultBackgroundSong"
    src="Ishq Bulaava Hasee Toh Phasee 128 Kbps.mp3"
    autoplay
    preload="auto">
  </audio>

  <script>
    const resultSong =
      document.getElementById("resultBackgroundSong");

    const surpriseBtn =
      document.getElementById("surpriseBtn");

    const MUSIC_POSITION_KEY =
      "debasrita_music_position_43";

    const SONG_START_TIME = 43;

    function getSavedPosition() {
      try {
        const saved = Number(
          localStorage.getItem(MUSIC_POSITION_KEY)
        );

        if (
          Number.isFinite(saved) &&
          saved >= SONG_START_TIME
        ) {
          return saved;
        }
      } catch (error) {}

      return SONG_START_TIME;
    }

    async function startResultSong() {
      try {
        resultSong.currentTime =
          getSavedPosition();

        await new Promise((resolve) => {
          const finish = () => {
            resultSong.removeEventListener(
              "seeked",
              finish
            );
            resolve();
          };

          resultSong.addEventListener(
            "seeked",
            finish,
            { once: true }
          );

          setTimeout(finish, 1000);
        });

        await resultSong.play();

      } catch (error) {
        console.warn(
          "Result music autoplay was blocked:",
          error
        );
      }
    }

    /*
     * Keep the same song looping from 00:43.
     */
    resultSong.addEventListener(
      "ended",
      async () => {
        resultSong.currentTime =
          SONG_START_TIME;

        await startResultSong();
      }
    );

    /*
     * Save current playback position.
     */
    setInterval(() => {
      if (!resultSong.paused) {
        try {
          localStorage.setItem(
            MUSIC_POSITION_KEY,
            String(resultSong.currentTime)
          );
        } catch (error) {}
      }
    }, 250);

    /*
     * Stop Ishq Bulaava BEFORE opening surprise.html.
     */
    surpriseBtn.addEventListener(
      "click",
      () => {

        resultSong.pause();
        resultSong.currentTime = 0;

        try {
          localStorage.removeItem(
            MUSIC_POSITION_KEY
          );
        } catch (error) {}

        window.location.href =
          "./surprise.html";
      }
    );

    startResultSong();

    const resultVideo =
      document.querySelector(".gif-result");

    resultVideo.play().catch(() => {});
  </script>

</body>
</html>
