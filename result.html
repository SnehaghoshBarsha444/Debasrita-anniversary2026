<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#ffffff">

<title>I knew it! ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
  rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body class="result-body">

<main class="result-page">

  <section class="result-container">

    <video
      class="gif-result"
      src="./Love%20me.mp4"
      autoplay
      loop
      muted
      playsinline
      preload="auto">
    </video>

    <h1>I knew it😍!</h1>

    <button
      id="surpriseBtn"
      class="surprise-btn"
      type="button">
      Surprise
    </button>

  </section>

</main>


<audio
  id="resultSong"
  src="./Ishq%20Bulaava%20Hasee%20Toh%20Phasee%20128%20Kbps.mp3"
  preload="auto">
</audio>


<script>
const resultSong =
  document.getElementById("resultSong");

const surpriseBtn =
  document.getElementById("surpriseBtn");

const START_TIME =
  43;

const POSITION_KEY =
  "debnit-anniversary-ishq-position";


async function startResultMusic() {

  try {

    await new Promise(resolve => {

      if (
        resultSong.readyState >= 1
      ) {

        resolve();
        return;

      }


      resultSong.addEventListener(
        "loadedmetadata",
        resolve,
        { once: true }
      );


      setTimeout(
        resolve,
        2000
      );

    });


    const saved =
      Number(
        localStorage.getItem(
          POSITION_KEY
        )
      );


    const position =
      Number.isFinite(saved) &&
      saved >= START_TIME

        ? saved

        : START_TIME;


    resultSong.currentTime =
      position;


    await new Promise(resolve => {

      const done = () => {

        resultSong.removeEventListener(
          "seeked",
          done
        );

        resolve();

      };


      resultSong.addEventListener(
        "seeked",
        done,
        { once: true }
      );


      setTimeout(
        done,
        1000
      );

    });


    await resultSong.play();

  } catch (error) {

    console.warn(
      "Result-page music autoplay blocked:",
      error
    );

  }

}


/*
 * Save exact position.
 */
setInterval(() => {

  if (
    !resultSong.paused &&
    Number.isFinite(
      resultSong.currentTime
    )
  ) {

    localStorage.setItem(
      POSITION_KEY,
      String(
        resultSong.currentTime
      )
    );

  }

}, 200);


/*
 * Loop from 00:43.
 */
resultSong.addEventListener(
  "ended",
  async () => {

    resultSong.currentTime =
      START_TIME;

    await startResultMusic();

  }
);


/*
 * Save position when leaving.
 */
window.addEventListener(
  "pagehide",
  () => {

    if (
      Number.isFinite(
        resultSong.currentTime
      )
    ) {

      localStorage.setItem(
        POSITION_KEY,
        String(
          resultSong.currentTime
        )
      );

    }

  }
);


/*
 * Surprise button:
 *
 * 1. Stop Ishq Bulaava.
 * 2. Remove its saved position.
 * 3. Open surprise.html.
 */
surpriseBtn.addEventListener(
  "click",
  () => {

    resultSong.pause();

    resultSong.currentTime =
      0;


    localStorage.removeItem(
      POSITION_KEY
    );


    window.location.assign(
      "./surprise.html"
    );

  }
);


startResultMusic();


document
  .querySelector(".gif-result")
  .play()
  .catch(() => {});
</script>

</body>
</html>
