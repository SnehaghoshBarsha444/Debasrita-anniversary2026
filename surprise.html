<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

  <title>A Little Surprise ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      background: #ffffff;

      font-family:
        "Quicksand",
        Arial,
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
    }

    .surprise-page {
      width: min(92vw, 650px);
      min-height: calc(100dvh - 36px);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .surprise-image {
      display: block;

      width: min(88vw, 520px);
      max-width: 100%;
      max-height: 68dvh;

      height: auto;
      object-fit: contain;

      border-radius: 14px;

      margin-bottom:
        clamp(18px, 4vw, 28px);

      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .surprise-title {
      color: #ff54a4;

      font-size:
        clamp(2rem, 8vw, 3.4rem);

      line-height: 1.15;
      font-weight: 700;

      margin-bottom: 10px;
    }

    .surprise-text {
      color: #777;

      font-size:
        clamp(0.95rem, 4vw, 1.15rem);

      line-height: 1.5;
      max-width: 520px;
    }

    @media (max-width: 600px) {
      .surprise-page {
        width: 92vw;
        min-height: calc(100dvh - 28px);
      }

      .surprise-image {
        width: min(88vw, 380px);
        max-height: 58dvh;
        margin-bottom: 18px;
      }

      .surprise-title {
        font-size:
          clamp(1.9rem, 9vw, 2.7rem);
      }
    }

    @media (max-width: 360px) {
      .surprise-image {
        width: 84vw;
        max-height: 52dvh;
      }

      .surprise-title {
        font-size: 1.75rem;
      }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .surprise-page {
        min-height: calc(100dvh - 20px);
      }

      .surprise-image {
        width: 240px;
        max-height: 55dvh;
        margin-bottom: 10px;
      }

      .surprise-title {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body>

  <main class="surprise-page">

    <img
      class="surprise-image"
      src="wishes.png"
      alt="A special anniversary wish">

    <h1 class="surprise-title">
      A little surprise ❤️
    </h1>

    <p class="surprise-text">
      Made with love, just for you.
    </p>

  </main>

  <audio
    id="surpriseSong"
    src="surpriseSong.mp3"
    autoplay
    loop
    preload="auto">
  </audio>

  <script>
    const surpriseSong =
      document.getElementById("surpriseSong");

    surpriseSong.currentTime = 0;

    surpriseSong.play().catch(() => {});
  </script>

</body>
</html>
