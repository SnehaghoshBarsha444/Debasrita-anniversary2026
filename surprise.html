<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#ffffff">

<title>Surprise ❤️</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100dvh;

  overflow: hidden;

  background: #ffffff;

  font-family:
    "Quicksand",
    Arial,
    sans-serif;

  display: flex;

  align-items: center;
  justify-content: center;

  padding:
    max(16px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(16px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
}

.surprise-page {
  width: min(92vw, 650px);

  min-height:
    calc(100dvh - 32px);

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;
}

.surprise-image {
  display: block;

  width: min(88vw, 520px);

  max-width: 100%;
  max-height: 68dvh;

  height: auto;

  object-fit: contain;

  border-radius: 14px;

  margin-bottom: 22px;

  pointer-events: none;
  user-select: none;
}

.surprise-page h1 {
  color: #ff54a4;

  font-size:
    clamp(2rem, 8vw, 3.4rem);

  line-height: 1.15;

  margin-bottom: 8px;
}

.surprise-page p {
  color: #777777;

  font-size:
    clamp(.95rem, 4vw, 1.1rem);
}

.audio-fallback {
  display: none;

  position: fixed;

  left: 50%;
  bottom: max(24px, env(safe-area-inset-bottom));

  transform:
    translateX(-50%);

  z-index: 100;

  border: 0;
  border-radius: 999px;

  padding: 12px 24px;

  background: #ff54a4;
  color: #ffffff;

  font-family:
    "Quicksand",
    Arial,
    sans-serif;

  font-weight: 600;

  box-shadow:
    0 5px 18px rgba(255, 84, 164, .3);

  cursor: pointer;
}

.audio-fallback.show {
  display: block;
}

@media (max-width: 600px) {

  .surprise-image {
    width: min(88vw, 380px);
    max-height: 58dvh;

    margin-bottom: 18px;
  }

}

@media (max-width: 360px) {

  .photo-card {
    width: 84vw;
    max-height: 52dvh;
  }

  .surprise-image {
    max-height: 52dvh;
  }

  .surprise-page h1 {
    font-size: 1.75rem;
  }

}
</style>
</head>

<body>

<main class="surprise-page">

  <img
    class="surprise-image"
    src="./wishes.png"
    alt="Special anniversary wish">

  <h1>
    A little surprise ❤️
  </h1>

  <p>
    Made with love, just for you.
  </p>

</main>


<audio
  id="surpriseSong"
  src="./surpriseSong.mp3"
  autoplay
  loop
  preload="auto">
</audio>


<button
  id="playSurpriseBtn"
  class="audio-fallback"
  type="button">
  ▶ Play Surprise Song
</button>


<script>
/* =========================
   PHOTO CARD SWAP
========================= */

const photoCard =
  document.getElementById("photoCard");

const surpriseImage =
  document.getElementById("surpriseImage");

let showingWishes = true;

function swapPhoto() {

  surpriseImage.style.opacity = "0";
  surpriseImage.style.transform =
    "scale(0.97)";

  setTimeout(() => {

    if (showingWishes) {

      surpriseImage.src =
        "./photo.jpeg";

      surpriseImage.alt =
        "Special photo";

    } else {

      surpriseImage.src =
        "./wishes.png";

      surpriseImage.alt =
        "Special anniversary wish";

    }

    showingWishes =
      !showingWishes;

    surpriseImage.style.opacity =
      "1";

    surpriseImage.style.transform =
      "scale(1)";

  }, 180);
}

photoCard.addEventListener(
  "click",
  swapPhoto
);

photoCard.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" ||
      event.key === " "
    ) {

      event.preventDefault();
      swapPhoto();

    }

  }
);


/* =========================
   SURPRISE SONG
========================= */

const surpriseSong =
  document.getElementById(
    "surpriseSong"
  );

const playSurpriseBtn =
  document.getElementById(
    "playSurpriseBtn"
  );


/*
 * Start surpriseSong from 00:00.
 */
async function startSurpriseSong() {

  try {

    surpriseSong.currentTime =
      0;

    await surpriseSong.play();

    /*
     * Autoplay worked.
     */
    playSurpriseBtn.classList.remove(
      "show"
    );

  } catch (error) {

    /*
     * IMPORTANT:
     *
     * Modern browsers can block audible autoplay
     * after navigation to a new HTML document.
     *
     * In that case, show one clean Play button.
     */
    playSurpriseBtn.classList.add(
      "show"
    );

    console.warn(
      "surpriseSong autoplay was blocked:",
      error
    );

  }

}


/*
 * User fallback if browser blocks autoplay.
 */
playSurpriseBtn.addEventListener(
  "click",
  async () => {

    try {

      await surpriseSong.play();

      playSurpriseBtn.classList.remove(
        "show"
      );

    } catch (error) {

      console.warn(
        "surpriseSong could not play:",
        error
      );

    }

  }
);


/*
 * Keep the song looping.
 */
surpriseSong.addEventListener(
  "ended",
  () => {

    surpriseSong.currentTime =
      0;

    surpriseSong.play().catch(() => {

      playSurpriseBtn.classList.add(
        "show"
      );

    });

  }
);


/*
 * Try autoplay immediately.
 */
startSurpriseSong();
</script>

</body>
</html>
